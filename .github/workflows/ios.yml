name: iOS app

# Builds the native iOS shell in src/mobile. Site-only changes (src/frontend, src/backend) never
# start this workflow: the app loads the live site, so they reach the phone without a rebuild.
on:
  push:
    paths:
      - 'src/mobile/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build .ipa + simulator smoke test
    # Capacitor 8 needs Xcode 26+, the default on macos-26.
    runs-on: macos-26
    timeout-minutes: 45
    # Write access only to publish GitHub Releases (the update channel) from main.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src/mobile
    env:
      MARKETING_VERSION: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/mobile/package-lock.json

      # The simulator's first boot spends ~5 min on setup; start it now so it overlaps the build.
      - name: Start booting a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          pick = next((d for d in devs if d["name"] == "iPhone 17 Pro"), None) or next(d for d in devs if d["name"].startswith("iPhone"))
          print(pick["udid"])')
          echo "SIM_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"

      - name: Install dependencies
        run: npm ci

      - name: Check Capacitor versions match the web app
        run: node scripts/check-versions.mjs

      - name: Install XcodeGen
        run: brew install xcodegen

      # Order matters: `cap copy` creates App/public and capacitor.config.json, XcodeGen adds them to
      # the project, and `cap update` needs the project to write Package.swift.
      - name: Generate Xcode project
        run: |
          npx cap copy ios
          (cd ios/App && xcodegen generate)
          npx cap update ios
          if ! git diff --exit-code -- ios/App/CapApp-SPM/Package.swift; then
            echo "::error::Package.swift is out of date. Run 'npx cap sync ios' in src/mobile and commit it."
            exit 1
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Archive for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      # SideStore reads App Groups and other capabilities from the entitlements embedded in each
      # binary, so the build is ad-hoc signed with them. SideStore re-signs everything on the phone.
      # Sign inside out: frameworks, then extensions, then the app.
      - name: Ad-hoc sign and package .ipa
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --sign - --timestamp=none {} \;
          fi
          if [ -d "$APP/PlugIns" ]; then
            for EXT in "$APP"/PlugIns/*.appex; do
              NAME="$(basename "$EXT" .appex)"
              codesign --force --sign - --timestamp=none \
                --entitlements "ios/App/$NAME/$NAME.entitlements" "$EXT"
            done
          fi
          if [ ! -d "$APP/PlugIns/BudgetWidget.appex" ]; then
            echo "::error::The widget extension is missing from the app bundle."; exit 1
          fi
          echo "Widget entitlements:"; codesign -d --entitlements - "$APP/PlugIns/BudgetWidget.appex" || true
          codesign --force --sign - --timestamp=none --entitlements ios/App/App/App.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "Embedded entitlements:"; codesign -d --entitlements - "$APP" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$APP/Info.plist"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/Budget-$MARKETING_VERSION.ipa" Payload)
          ls -l "$RUNNER_TEMP"/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Budget-${{ env.MARKETING_VERSION }}-ipa
          path: ${{ runner.temp }}/Budget-${{ env.MARKETING_VERSION }}.ipa
          if-no-files-found: error

      # Launches the app on an iPhone simulator and checks it shows the live site. Catches crashes
      # and blank screens before anything reaches the phone. Can't test SideStore, Face ID or OAuth.
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Simulator smoke test
        run: |
          APP="$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/App.app"
          DEVICE="$SIM_DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b > /dev/null
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.ondrejkutil.budget -budget.lock.enabled NO
          sleep 30
          mkdir -p "$RUNNER_TEMP/smoke"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/smoke/screenshot.png"
          xcrun simctl spawn "$DEVICE" log show --last 2m --style compact \
            --predicate 'process == "App"' > "$RUNNER_TEMP/smoke/app.log" || true
          echo "--- App log (Capacitor lines) ---"
          grep -E "⚡️|Capacitor|WebView|Error|Fatal" "$RUNNER_TEMP/smoke/app.log" | tail -40 || true

          # A small JPEG of the screen in the log, so it can be checked without downloading artifacts.
          sips -s format jpeg -s formatOptions 40 -Z 640 "$RUNNER_TEMP/smoke/screenshot.png" \
            --out "$RUNNER_TEMP/smoke/screenshot-small.jpg" >/dev/null
          echo "SCREENSHOT_BASE64_BEGIN"; base64 -i "$RUNNER_TEMP/smoke/screenshot-small.jpg" | fold -w 1000; echo "SCREENSHOT_BASE64_END"

          if ! xcrun simctl spawn "$DEVICE" launchctl list | grep -q "com.ondrejkutil.budget"; then
            echo "::error::The app is not running 30 s after launch (crashed?)."
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/App-*.ips 2>/dev/null | head -1); do
              cp "$f" "$RUNNER_TEMP/smoke/"
              echo "--- Crash report: $f ---"; head -c 6000 "$f"
            done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke-${{ github.run_number }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

      # Update channel: builds from main become a GitHub Release, and the SideStore source
      # (source.json, at a fixed URL on the `ios-source` release) is rewritten to point at it.
      # SideStore then shows the new version as an update. Branch builds only upload artifacts.
      - name: Publish release and SideStore source
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-v$MARKETING_VERSION"
          IPA="$RUNNER_TEMP/Budget-$MARKETING_VERSION.ipa"
          NOTES="$(git log -1 --pretty=%s)"
          case "$NOTES" in "Merge pull request"*) NOTES="$(git log -1 --pretty=%b | head -1)";; esac

          gh release create "$TAG" "$IPA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Budget iOS $MARKETING_VERSION" --notes "$NOTES" --latest=false

          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Budget-$MARKETING_VERSION.ipa"
          python3 scripts/make-source.py --ipa "$IPA" --version "$MARKETING_VERSION" --build "$BUILD_NUMBER" \
            --download-url "$URL" --notes "$NOTES" --out "$RUNNER_TEMP/source.json"

          SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/ios-source/source.json"
          if ! gh release view ios-source --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ios-source --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Budget iOS: SideStore source" --notes "Add this URL as a source in SideStore: $SOURCE_URL"
          fi
          gh release upload ios-source "$RUNNER_TEMP/source.json" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published $TAG; source: $SOURCE_URL"
