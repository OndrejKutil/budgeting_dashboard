# Scheduled jobs on the Raspberry Pi. After a change is merged to main, run `bd update` on the Pi.
#
# One job per line:  <name>  <script in scripts/>  <schedule>
#   name      short id used by bd (`bd run fx`); letters, digits, dashes
#   script    file in scripts/, run with the shared venv; reads config from ~/budget/.env
#   schedule  systemd OnCalendar expression, Pi local time (Europe/Prague). Examples:
#               06:00                 every day at 06:00
#               *:0/30                every 30 minutes (:00 and :30)
#               0/3:00                every 3 hours (00:00, 03:00, 06:00, …)
#               hourly                every hour
#               Mon *-*-* 08:00       Mondays at 08:00
#               *-*-01 07:00          the 1st of every month at 07:00
#             Check one with: systemd-analyze calendar "06:00"
#
# A run missed while the Pi was off is caught up right after it boots.

recurring   post_recurring.py           05:00
fx          refresh_exchange_rates.py   06:00
trading     sync_trading212.py          0/3:00
