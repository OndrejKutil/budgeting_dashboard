<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Budget – offline</title>
  <!-- Shown by the native app when budget.ondrejkutil.com can't be loaded (see server.errorPath). -->
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      background: #060d10; color: #e6edf0;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center;
    }
    main { max-width: 22rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.5rem; color: #9aa9b0; }
    a {
      display: inline-block; padding: .75rem 1.5rem; border-radius: 999px;
      background: #e6edf0; color: #060d10; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach Budget</h1>
    <p>Check your internet connection and try again.<br />Nemůžu se připojit, zkontrolujte připojení.</p>
    <a href="https://budget.ondrejkutil.com/dashboard">Try again</a>
  </main>
</body>
</html>
