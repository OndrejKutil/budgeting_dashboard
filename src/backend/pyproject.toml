[project]
name = "budgeting-backend"
version = "0.1.0"
description = "Budgeting Dashboard Backend API"
requires-python = ">=3.13"
authors = [
    {name = "Budgeting Dashboard Team"}
]
license = {text = "MIT"}
keywords = ["fastapi", "budgeting", "finance", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    # FastAPI and server dependencies
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Environment variable management
    "python-dotenv==1.0.0",
    # JWT token handling
    "PyJWT==2.8.0",
    # Supabase client for database operations
    "supabase==1.0.4",
    # Data validation and serialization
    "pydantic>=2.0.0",
    # HTTP client (dependency of supabase)
    "httpx>=0.24.0",
    # Form data handling
    "python-multipart==0.0.6",
    # Data manipulation
    "polars>=0.20.0",
    # Fix the missing type hints in some dependencies
    "types-python-dateutil",
    "groq>=1.6.0",
    # Encrypting the Trading212 API key/secret at rest
    "cryptography>=42.0.0",
]

# Install (from src/backend/):
#   Production, runtime deps only:
#     pip install .                    (or: uv pip install .)
#   Development — adds mypy, ruff, pytest below:
#     pip install -e ".[dev,test]"     (or: uv pip install -e ".[dev,test]")
#   `-e` (editable) is what lets mypy/pytest import this package's modules straight from
#   source, so a code change is picked up without reinstalling.
[project.optional-dependencies]
dev = [
    # Type checking & linting
    "mypy>=1.8.0",
    "ruff>=0.16.0",
    "lxml>=6.0.2",

    "requests>=2.31.0",

    # Type stubs for third-party packages
    "types-requests>=2.31.0",

    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",  # For TestClient
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
]

[project.scripts]
# Entry points for running the application
budgeting-backend = "backend_server:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["backend_server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["auth*", "helper*", "routers*", "schemas*"]

[tool.setuptools.package-data]
"*" = ["*.py"]

# =============================================================================
#                              Tool Configuration
# =============================================================================

# mypy: run with `mypy .` from src/backend/. Gradually-strict config — the `disallow_*`
# flags are off for now (see README/CLAUDE.md); flip them on module-by-module as the
# codebase earns it rather than all at once.
[tool.mypy]
python_version = "3.13"
files = ["**/*.py"]
exclude = ["__pycache__", "\\.venv", "venv", "build", "dist"]
platform = "linux"

namespace_packages = true
explicit_package_bases = true

strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
allow_redefinition = false
implicit_reexport = true
strict_equality = true

# Runtime always loads this code as the "backend" package (PYTHONPATH set one level up —
# see Dockerfile), so internal relative imports like "from ...auth.auth import x" resolve
# only under that root. Run from src/backend/, mypy has no way to see that root, so it
# can't resolve those (or third-party libs without stubs, e.g. supabase) — hence the
# blanket ignore_missing_imports. This does NOT disable type-checking within a file, only
# "can't find this import" errors; genuinely misspelled imports will slip through unnoticed.
ignore_missing_imports = true

# Error output
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true
color_output = true
error_summary = true

# pytest: run with `pytest` (or `pytest -k <name>` for a single test) from src/backend/.
# Coverage (below) reports against the whole package, not just tests/ — 0% on a router
# file means "no test imports it yet", not "broken", since most coverage here comes
# from the pure-logic unit tests in tests/, not from hitting the live API.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ruff: run `ruff check .` (lint) or `ruff check --fix .` (autofix) from src/backend/.
# Separate from mypy — mypy checks types, ruff checks everything else (unused
# imports/variables, import order, obvious bugs, outdated syntax).
[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["htmlcov"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/variables, undefined names)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax for the pinned Python version)
    "B",   # flake8-bugbear (common footguns, e.g. mutable default arguments)
]
# Deliberately deferred rather than fixed — each below is pre-existing debt found the
# first time ruff ever ran here, not something a config change should silently paper over:
ignore = [
    "B008",  # FastAPI's own Depends()/Query() as a default argument value; not a bug
    "B904",  # raise-without-from-inside-except — ~74 sites; needs its own exception-handling pass
    "E501",  # line too long — ~130 pre-existing long lines scattered across the app
    "UP042", # str+Enum -> StrEnum changes str()/f-string output; needs a deliberate check first
]
